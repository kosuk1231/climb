<!-- ================= 2026 등반대회 경품 이벤트 (iframe 삽입) =================
     붙여넣는 위치 : 소스에서 처음 나오는 "👉️" 가 있는 <p ...> 줄 바로 앞
     (= "...많은 관심과 참여 부탁드립니다." 문단 다음)
     ※ 붙여넣은 뒤 위지윅(일반) 모드로 되돌리지 말고 그대로 저장하세요.
========================================================================= -->
<div class="climb-promo">
  <iframe src="https://climb-applications.vercel.app/promo.html"
          title="2026 서울사회복지사 등반대회 경품 이벤트"
          scrolling="no" frameborder="0"></iframe>
</div>

<style type="text/css">
/* 경품 이벤트 iframe : 기본(예비) 높이 — 스크립트가 동작하면 자동 보정됩니다 */
.climb-promo{position:relative;width:100%;height:1240px;overflow:hidden;margin:10px 0}
.climb-promo iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
@media (max-width:1100px){.climb-promo{height:1760px}}
@media (max-width:620px){.climb-promo{height:1820px}}
@media (max-width:480px){.climb-promo{height:1900px}}
@media (max-width:360px){.climb-promo{height:2010px}}
</style>

<script type="text/javascript">
/* iframe 내부 높이를 받아 자동으로 맞춥니다 (여백/스크롤 방지) */
(function(){
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if (!d || !d.climbPromoHeight) return;
    var box = document.querySelector('.climb-promo');
    if (box) box.style.height = (d.climbPromoHeight + 8) + 'px';
  });
})();
</script>
